name: Publish Quarto book

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - uses: actions/cache@v4
        with:
          path: data/processed
          key: book-${{ runner.os }}-${{ hashFiles('renv.lock', 'book/_common.R', 'book/*.qmd') }}
          restore-keys: book-${{ runner.os }}-
      - name: Download BRFSS 2024
        shell: Rscript {0}
        run: |
          dir.create("data/raw", recursive = TRUE, showWarnings = FALSE)
          options(timeout = 600)
          archive <- tempfile(fileext = ".zip")
          download.file(
            "https://www.cdc.gov/brfss/annual_data/2024/files/LLCP2024XPT.zip",
            archive, mode = "wb"
          )
          extracted <- unzip(archive, exdir = "data/raw")
          stopifnot(file.rename(extracted, "data/raw/LLCP2024.XPT"))
      - name: Render the complete book
        run: quarto render book
      - uses: actions/upload-pages-artifact@v4
        with:
          path: book/_book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
